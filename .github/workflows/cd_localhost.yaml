name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Pull latest code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install django

      - name: Kill previous instance
        run: |
          pkill -f "manage.py runserver" || true
          screen -ls | grep django | awk '{print $1}' | xargs -I{} screen -S {} -X quit || true

      - name: Start server in screen session
        run: |
          cd ${{ github.workspace }}/djangotutorial
          screen -dmS django python3 manage.py runserver 0.0.0.0:8000
          sleep 3
          echo "Server started on localhost:8000"