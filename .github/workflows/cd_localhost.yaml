name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Pull latest code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install django

      - name: Deploy server
        run: bash ~/start_django.sh

      - name: Verify server
        run: |
          sleep 5
          ps aux | grep manage.py | grep -v grep
          curl -s http://localhost:8000/polls/ | head -3 || echo "Server check done"