name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Pull latest code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install django

      - name: Kill previous instance
        run: |
          pkill -f "manage.py runserver" || true

      - name: Start server in background
        run: |
          cd ${{ github.workspace }}/djangotutorial
          nohup python3 manage.py runserver 0.0.0.0:8000 > /tmp/django.log 2>&1 &
          sleep 2
          echo "Server started, checking..."
          cat /tmp/django.log